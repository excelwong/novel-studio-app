apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.example.novelstudio'
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId 'com.example.novelstudio'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '1.0.8'
        manifestPlaceholders = [appName: "小说连载工坊"]
    }

    // 两个发行变体：remote=局域网模型（默认），local=本机 127.0.0.1 模型。
    // local 的 applicationId 带 .local 后缀，可与 remote 版并行安装。
    flavorDimensions "endpoint"
    productFlavors {
        remote {
            dimension "endpoint"
            buildConfigField "String", "DEFAULT_BASE_URL", '"http://100.107.217.62:1234/v1"'
        }
        local {
            dimension "endpoint"
            applicationIdSuffix ".local"
            manifestPlaceholders = [appName: "小说连载工坊·本机"]
            buildConfigField "String", "DEFAULT_BASE_URL", '"http://127.0.0.1:1234/v1"'
        }
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('release-signing.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
